<style>
:root{
  --paper:#eef1f6;      /* 薄墨をふくんだ紙 */
  --paper-raised:#f8fafc;
  --ink:#16233d;        /* 本文 */
  --ink-soft:#5a6784;   /* 補足 */
  --ai:#1e3a6b;         /* 藍 — 見出しとリンク */
  --gold:#d9a03c;       /* 月にだけ使う */
  --rule:#d6dce6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'Hiragino Sans','Noto Sans JP','メイリオ',sans-serif;
  font-size:17px;line-height:1.95;letter-spacing:.02em;
}
.wrap{max-width:720px;margin:0 auto;padding:0 22px}
a{color:var(--ai)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ai);outline-offset:3px}

/* ヘッダ */
.masthead{border-bottom:1px solid var(--rule);background:var(--paper-raised)}
.masthead .wrap{display:flex;align-items:baseline;gap:14px;padding-top:20px;padding-bottom:20px}
.masthead h1{
  font-family:'Noto Serif JP',serif;font-weight:600;font-size:1.15rem;
  margin:0;letter-spacing:.22em;color:var(--ai)
}
.masthead a{text-decoration:none}
.masthead p{margin:0;font-size:.76rem;color:var(--ink-soft);letter-spacing:.08em}

/* 記事の頭 */
.hero{padding:46px 0 30px;text-align:center}
.hero .date{font-size:.82rem;color:var(--ink-soft);letter-spacing:.14em;margin-bottom:22px}
.moon{display:block;margin:0 auto 10px}
.moon-caption{font-size:.8rem;color:var(--ink-soft);letter-spacing:.06em}
.hero h2{
  font-family:'Noto Serif JP',serif;font-weight:600;
  font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.4;
  margin:26px 0 6px;color:var(--ai);letter-spacing:.06em
}
.hero .kana{font-size:.86rem;color:var(--ink-soft);letter-spacing:.1em}
.hero .sekki{margin-top:14px;font-size:.9rem;color:var(--ink-soft)}

/* 候の5日 — 内容そのものを表す目盛り */
.kou-days{display:flex;gap:7px;justify-content:center;margin-top:16px}
.kou-days i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
.kou-days i.on{background:var(--ai)}
.kou-days i.today{background:var(--gold);transform:scale(1.5)}

/* 本文 */
article{padding:8px 0 40px}
article p{margin:0 0 1.5em}
hr{border:0;border-top:1px solid var(--rule);margin:38px 0}

/* アプリへの案内 */
.app-card{
  background:var(--paper-raised);border:1px solid var(--rule);
  border-radius:14px;padding:24px 22px;margin:10px 0 34px
}
.app-card h3{font-family:'Noto Serif JP',serif;font-weight:600;font-size:1.02rem;margin:0 0 8px;color:var(--ai)}
.app-card p{font-size:.92rem;color:var(--ink-soft);margin:0 0 16px}
.app-card a.btn{
  display:block;text-align:center;text-decoration:none;
  background:var(--ai);color:#fff;font-weight:700;font-size:.94rem;
  padding:13px;border-radius:10px
}

/* 一覧 */
.archive{padding:34px 0 10px}
.archive h2{font-family:'Noto Serif JP',serif;font-weight:600;font-size:1.05rem;margin:0 0 4px;color:var(--ai);letter-spacing:.1em}
.archive .lead{font-size:.9rem;color:var(--ink-soft);margin:0 0 26px}
.entry{display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--rule);text-decoration:none;color:inherit}
.entry:last-child{border-bottom:1px solid var(--rule)}
.entry .moon{margin:0;flex:none}
.entry .t{font-family:'Noto Serif JP',serif;font-size:1.05rem;color:var(--ai);margin:0 0 3px}
.entry .d{font-size:.78rem;color:var(--ink-soft)}

/* 広告枠 — 本文と地続きに見えないよう罫線で隔てる */
.ad{margin:34px 0;padding-top:18px;border-top:1px solid var(--rule)}
.ad small{display:block;font-size:.7rem;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:10px}

footer{border-top:1px solid var(--rule);margin-top:30px;padding:26px 0 44px;font-size:.8rem;color:var(--ink-soft)}
footer a{color:var(--ink-soft)}
footer nav{margin-bottom:10px;display:flex;gap:18px;flex-wrap:wrap}

@media (prefers-reduced-motion:no-preference){
  .hero .moon{animation:rise .9s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
</style>

</head>
